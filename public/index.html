<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CrossDoc</title>
    <style>
      :root {
        --bg: #f5f7fa;
        --surface: #ffffff;
        --surface-soft: #f9fafb;
        --border: #dbe2ea;
        --border-strong: #c7d0dc;
        --text: #17202a;
        --muted: #607086;
        --blue: #165dff;
        --blue-soft: #eaf1ff;
        --green: #16825d;
        --green-soft: #e9f7f1;
        --amber: #9a6700;
        --amber-soft: #fff5d9;
        --red: #bc3434;
        --red-soft: #fdecec;
        --ink: #0f1720;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 5;
        border-top: 6px solid #30283f;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(12px);
      }

      .shell {
        width: min(1280px, calc(100vw - 32px));
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        min-height: 78px;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 2px;
        font-size: 24px;
        font-weight: 760;
      }

      h2 {
        margin-bottom: 14px;
        font-size: 16px;
      }

      h3 {
        margin-bottom: 8px;
        font-size: 15px;
      }

      .tagline {
        margin-bottom: 0;
        color: var(--muted);
        font-size: 14px;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface-soft);
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }

      .pill strong {
        color: var(--text);
      }

      main {
        padding: 22px 0 36px;
      }

      .workspace {
        display: grid;
        grid-template-columns: 330px minmax(420px, 1fr) 360px;
        gap: 16px;
        align-items: start;
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        box-shadow: 0 1px 2px rgba(23, 32, 42, 0.04);
      }

      .panel-body {
        padding: 18px;
      }

      .muted {
        color: var(--muted);
      }

      .small {
        font-size: 13px;
      }

      .upload-zone {
        display: block;
        padding: 18px;
        border: 1px dashed var(--border-strong);
        border-radius: 10px;
        background: var(--surface-soft);
        cursor: pointer;
      }

      .upload-zone:hover {
        border-color: var(--blue);
        background: #f6f9ff;
      }

      .upload-zone input {
        width: 100%;
        margin-top: 12px;
      }

      .button-row {
        display: grid;
        gap: 10px;
        margin-top: 14px;
      }

      button {
        min-height: 40px;
        padding: 10px 14px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: var(--blue);
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        border-color: var(--border);
        background: var(--surface);
        color: var(--text);
      }

      button:disabled {
        background: #a7b0bd;
        cursor: not-allowed;
      }

      .status-box {
        margin-top: 14px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-soft);
        color: var(--muted);
        font-size: 14px;
      }

      .steps {
        display: grid;
        gap: 8px;
        margin: 16px 0 0;
        padding: 0;
        list-style: none;
      }

      .step {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
      }

      .dot {
        width: 9px;
        height: 9px;
        border: 2px solid var(--border-strong);
        border-radius: 999px;
        background: var(--surface);
      }

      .step.active {
        color: var(--blue);
        font-weight: 700;
      }

      .step.active .dot {
        border-color: var(--blue);
        background: var(--blue);
      }

      .step.done {
        color: var(--green);
      }

      .step.done .dot {
        border-color: var(--green);
        background: var(--green);
      }

      .doc-list {
        display: grid;
        gap: 8px;
        margin-top: 16px;
      }

      .doc-item {
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }

      .doc-item strong {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }

      .metric {
        min-height: 76px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-soft);
      }

      .metric strong {
        display: block;
        font-size: 24px;
      }

      .metric span {
        color: var(--muted);
        font-size: 12px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .segmented {
        display: inline-flex;
        padding: 3px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-soft);
      }

      .segment {
        min-height: 30px;
        padding: 6px 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      .segment.active {
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 1px 2px rgba(23, 32, 42, 0.08);
      }

      .findings {
        display: grid;
        gap: 10px;
      }

      .finding {
        width: 100%;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface);
        text-align: left;
      }

      .finding:hover,
      .finding.selected {
        border-color: var(--blue);
        background: #f7faff;
      }

      .finding-title {
        margin-bottom: 8px;
        color: var(--text);
        font-weight: 760;
        line-height: 1.35;
      }

      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
      }

      .badge.high {
        background: var(--red-soft);
        color: var(--red);
      }

      .badge.medium {
        background: var(--amber-soft);
        color: var(--amber);
      }

      .badge.low {
        background: var(--green-soft);
        color: var(--green);
      }

      .badge.neutral {
        background: var(--blue-soft);
        color: var(--blue);
      }

      .detail-stack {
        display: grid;
        gap: 14px;
      }

      .detail-card {
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface-soft);
      }

      .evidence-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .evidence-item {
        padding: 10px;
        border-left: 3px solid var(--blue);
        border-radius: 6px;
        background: var(--surface);
      }

      .quote {
        margin: 6px 0 0;
        color: #344054;
        font-size: 13px;
        line-height: 1.55;
      }

      pre {
        overflow: auto;
        max-height: 300px;
        margin: 0;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--ink);
        color: #dce7f3;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .empty {
        display: grid;
        place-items: center;
        min-height: 220px;
        border: 1px dashed var(--border-strong);
        border-radius: 9px;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 1120px) {
        .workspace {
          grid-template-columns: 320px 1fr;
        }

        .details-panel {
          grid-column: 1 / -1;
        }
      }

      @media (max-width: 760px) {
        .topbar,
        .toolbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .workspace,
        .metrics {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="shell topbar">
        <div>
          <h1>CrossDoc</h1>
          <p class="tagline">基于证据的多文档一致性审查工作台</p>
        </div>
        <div class="header-actions">
          <span class="pill"><strong>本地运行</strong></span>
          <span class="pill">Pi SDK runtime boundary</span>
        </div>
      </div>
    </header>

    <main class="shell workspace">
      <aside class="panel">
        <div class="panel-body">
          <h2>审查输入</h2>
          <form id="review-form">
            <label class="upload-zone" for="documents">
              <strong>上传 PDF</strong>
              <p class="muted small">选择一组需要互相校验的文档。原文件只用于本次本地审查。</p>
              <input id="documents" name="documents" type="file" accept="application/pdf,.pdf" multiple />
            </label>
            <div class="button-row">
              <button id="submit" type="submit">开始审查</button>
              <button class="secondary" id="reset" type="button">清空结果</button>
            </div>
          </form>

          <div id="status" class="status-box">等待上传。</div>

          <ul class="steps" id="steps">
            <li class="step" data-stage="upload"><span class="dot"></span>上传文档</li>
            <li class="step" data-stage="parse"><span class="dot"></span>解析页面文本</li>
            <li class="step" data-stage="extract"><span class="dot"></span>抽取 claims</li>
            <li class="step" data-stage="compare"><span class="dot"></span>比较候选矛盾</li>
            <li class="step" data-stage="verify"><span class="dot"></span>验证证据</li>
            <li class="step" data-stage="report"><span class="dot"></span>生成报告</li>
          </ul>

          <div class="doc-list" id="documents-list"></div>
        </div>
      </aside>

      <section class="panel">
        <div class="panel-body">
          <div class="metrics" id="summary">
            <div class="metric"><strong>0</strong><span>文档</span></div>
            <div class="metric"><strong>0</strong><span>Claims</span></div>
            <div class="metric"><strong>0</strong><span>全部矛盾</span></div>
            <div class="metric"><strong>0</strong><span>已验证</span></div>
          </div>

          <div class="toolbar">
            <div>
              <h2 style="margin-bottom: 4px">发现项</h2>
              <p class="muted small" style="margin-bottom: 0">按矛盾项检查证据，而不是只看一份最终报告。</p>
            </div>
            <div class="segmented" aria-label="finding filter">
              <button class="segment active" type="button" data-filter="all">全部</button>
              <button class="segment" type="button" data-filter="verified">已验证</button>
              <button class="segment" type="button" data-filter="dismissed">已排除</button>
            </div>
          </div>

          <div id="findings" class="findings">
            <div class="empty">上传 PDF 后，这里会显示候选矛盾、验证状态和证据。</div>
          </div>
        </div>
      </section>

      <aside class="panel details-panel">
        <div class="panel-body detail-stack">
          <div>
            <h2>证据详情</h2>
            <p class="muted small">选择左侧发现项，查看引用页码和原文片段。</p>
          </div>

          <div id="details" class="detail-card">
            <p class="muted" style="margin-bottom: 0">暂无选中的发现项。</p>
          </div>

          <div>
            <div class="toolbar">
              <h2 style="margin-bottom: 0">Markdown 报告</h2>
              <div class="header-actions">
                <button class="secondary" id="copy-report" type="button">复制</button>
                <button class="secondary" id="download-report" type="button">下载</button>
              </div>
            </div>
            <pre id="report">暂无报告。</pre>
          </div>
        </div>
      </aside>
    </main>

    <script>
      const form = document.querySelector("#review-form");
      const fileInput = document.querySelector("#documents");
      const submit = document.querySelector("#submit");
      const reset = document.querySelector("#reset");
      const status = document.querySelector("#status");
      const steps = [...document.querySelectorAll(".step")];
      const documentsList = document.querySelector("#documents-list");
      const summary = document.querySelector("#summary");
      const findings = document.querySelector("#findings");
      const details = document.querySelector("#details");
      const report = document.querySelector("#report");
      const copyReport = document.querySelector("#copy-report");
      const downloadReport = document.querySelector("#download-report");
      const filters = [...document.querySelectorAll(".segment")];

      let currentData = null;
      let selectedConflictId = null;
      let activeFilter = "all";

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function setBusy(isBusy) {
        submit.disabled = isBusy;
        submit.textContent = isBusy ? "审查中..." : "开始审查";
      }

      function setStage(stage) {
        const order = ["upload", "parse", "extract", "compare", "verify", "report"];
        const activeIndex = order.indexOf(stage);
        steps.forEach((step) => {
          const stepIndex = order.indexOf(step.dataset.stage);
          step.classList.toggle("active", stepIndex === activeIndex);
          step.classList.toggle("done", activeIndex > stepIndex);
        });
      }

      function renderSelectedFiles(files) {
        documentsList.innerHTML = "";
        if (!files || files.length === 0) return;

        documentsList.innerHTML = [...files]
          .map(
            (file) => `
              <div class="doc-item">
                <strong>${escapeHtml(file.name)}</strong>
                <span class="muted small">${Math.max(1, Math.round(file.size / 1024))} KB</span>
              </div>
            `,
          )
          .join("");
      }

      function renderSummary(data) {
        summary.innerHTML = `
          <div class="metric"><strong>${data.documents.length}</strong><span>文档</span></div>
          <div class="metric"><strong>${data.claimCount}</strong><span>Claims</span></div>
          <div class="metric"><strong>${data.conflictCount}</strong><span>全部矛盾</span></div>
          <div class="metric"><strong>${data.verifiedConflictCount}</strong><span>已验证</span></div>
        `;
      }

      function filteredConflicts() {
        if (!currentData) return [];
        if (activeFilter === "all") return currentData.conflicts;
        return currentData.conflicts.filter((conflict) => conflict.status === activeFilter);
      }

      function severityClass(severity) {
        if (severity === "high") return "high";
        if (severity === "medium") return "medium";
        return "low";
      }

      function renderFindings() {
        const conflicts = filteredConflicts();
        if (!currentData) {
          findings.innerHTML = '<div class="empty">上传 PDF 后，这里会显示候选矛盾、验证状态和证据。</div>';
          return;
        }

        if (!conflicts.length) {
          findings.innerHTML = '<div class="empty">当前筛选条件下没有发现项。</div>';
          renderDetails(null);
          return;
        }

        if (!selectedConflictId || !conflicts.some((conflict) => conflict.id === selectedConflictId)) {
          selectedConflictId = conflicts[0].id;
        }

        findings.innerHTML = conflicts
          .map(
            (conflict) => `
              <button class="finding ${conflict.id === selectedConflictId ? "selected" : ""}" type="button" data-id="${escapeHtml(conflict.id)}">
                <div class="finding-title">${escapeHtml(conflict.summary)}</div>
                <div class="badges">
                  <span class="badge ${severityClass(conflict.severity)}">${escapeHtml(conflict.severity)}</span>
                  <span class="badge neutral">${escapeHtml(conflict.status)}</span>
                  <span class="badge neutral">score ${Number(conflict.score).toFixed(2)}</span>
                </div>
                <p class="muted small" style="margin: 10px 0 0">${escapeHtml(conflict.rationale)}</p>
              </button>
            `,
          )
          .join("");

        for (const item of findings.querySelectorAll(".finding")) {
          item.addEventListener("click", () => {
            selectedConflictId = item.dataset.id;
            renderFindings();
          });
        }

        renderDetails(conflicts.find((conflict) => conflict.id === selectedConflictId));
      }

      function renderDetails(conflict) {
        if (!conflict) {
          details.innerHTML = '<p class="muted" style="margin-bottom: 0">暂无选中的发现项。</p>';
          return;
        }

        const evidence = conflict.evidence
          .map(
            (item) => `
              <li class="evidence-item">
                <strong>${escapeHtml(item.documentId)} · 第 ${item.page} 页</strong>
                <p class="quote">${escapeHtml(item.quote)}</p>
              </li>
            `,
          )
          .join("");

        details.innerHTML = `
          <h3>${escapeHtml(conflict.summary)}</h3>
          <div class="badges" style="margin-bottom: 10px">
            <span class="badge ${severityClass(conflict.severity)}">${escapeHtml(conflict.severity)}</span>
            <span class="badge neutral">${escapeHtml(conflict.status)}</span>
          </div>
          <p class="small">${escapeHtml(conflict.rationale)}</p>
          <ul class="evidence-list">${evidence}</ul>
        `;
      }

      function resetUi() {
        currentData = null;
        selectedConflictId = null;
        activeFilter = "all";
        fileInput.value = "";
        status.textContent = "等待上传。";
        documentsList.innerHTML = "";
        report.textContent = "暂无报告。";
        summary.innerHTML = `
          <div class="metric"><strong>0</strong><span>文档</span></div>
          <div class="metric"><strong>0</strong><span>Claims</span></div>
          <div class="metric"><strong>0</strong><span>全部矛盾</span></div>
          <div class="metric"><strong>0</strong><span>已验证</span></div>
        `;
        filters.forEach((filter) => filter.classList.toggle("active", filter.dataset.filter === "all"));
        steps.forEach((step) => step.classList.remove("active", "done"));
        renderFindings();
        renderDetails(null);
      }

      fileInput.addEventListener("change", () => {
        renderSelectedFiles(fileInput.files);
        status.textContent = fileInput.files.length ? `已选择 ${fileInput.files.length} 个文件。` : "等待上传。";
      });

      filters.forEach((filter) => {
        filter.addEventListener("click", () => {
          activeFilter = filter.dataset.filter;
          filters.forEach((item) => item.classList.toggle("active", item === filter));
          renderFindings();
        });
      });

      reset.addEventListener("click", resetUi);

      copyReport.addEventListener("click", async () => {
        await navigator.clipboard.writeText(report.textContent || "");
        status.textContent = "报告已复制。";
      });

      downloadReport.addEventListener("click", () => {
        const blob = new Blob([report.textContent || ""], { type: "text/markdown;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "crossdoc-review.md";
        link.click();
        URL.revokeObjectURL(url);
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const files = fileInput.files;
        if (!files || files.length === 0) {
          status.textContent = "请先选择 PDF。";
          return;
        }

        const formData = new FormData();
        for (const file of files) {
          formData.append("documents", file);
        }

        setBusy(true);
        setStage("upload");
        status.textContent = "正在上传并审查，请稍候。";
        findings.innerHTML = '<div class="empty">审查中...</div>';
        details.innerHTML = '<p class="muted" style="margin-bottom: 0">正在生成证据详情。</p>';
        report.textContent = "审查中...";

        try {
          setStage("parse");
          const response = await fetch("/api/review", {
            method: "POST",
            body: formData,
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "审查失败。");
          }

          currentData = data;
          selectedConflictId = data.conflicts[0]?.id ?? null;
          setStage("report");
          steps.forEach((step) => step.classList.add("done"));
          status.textContent = "审查完成。";
          renderSummary(data);
          renderFindings();
          report.textContent = data.reportMarkdown;
        } catch (error) {
          status.textContent = error instanceof Error ? error.message : "审查失败。";
          findings.innerHTML = '<div class="empty">没有可显示的结果。</div>';
          details.innerHTML = '<p class="muted" style="margin-bottom: 0">暂无证据详情。</p>';
          report.textContent = "暂无报告。";
        } finally {
          setBusy(false);
        }
      });
    </script>
  </body>
</html>
